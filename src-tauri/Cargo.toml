[package]
name = "wirecat-desktop"
version = "0.6.2"
description = "WireCat Desktop: install and manage WireCat tools"
authors = ["Viacheslav Ptsarev"]
license = "Apache-2.0"
repository = "https://github.com/WireCatLabs/wirecat-desktop"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wirecat_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
# Only its free functions (reveal, open a file); the plugin is not registered, so the window has no second way to
# open an address that skips host_open.rs.
tauri-plugin-opener = "2"
# The launchers the opener uses, started here with the system's environment instead of the AppImage's (host_open.rs).
open = "5"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
which = "8"
# The digest notification: Tauri's notification plugin has no click on desktop; notify-rust reports it.
notify-rust = "4"
regex = "1"
aho-corasick = "1"
semver = "1"
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
fs4 = { version = "1", default-features = false, features = ["sync"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
zeroize = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
base64 = "0.23"
x509-parser = "0.18"
# Already in the build through tauri-plugin-updater; checks the community list's signature (registry.rs).
minisign-verify = "0.3"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry"] }
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"

[dev-dependencies]
# Makes a throwaway key pair and signs test lists; never in the app.
minisign = "0.10"
# Make a real refused connection for the update error test; both already in the build through tauri-plugin-updater.
reqwest = { version = "0.13", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
specta-serde = "=0.0.13"
specta-util = "=0.0.13"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-autostart = "2.7.0"
# A second launch, such as the system opening a wirecat:// link, hands its link to the running window instead.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
dbg_macro = "deny"
todo = "deny"
redundant_clone = "warn"
or_fun_call = "warn"
