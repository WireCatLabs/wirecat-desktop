<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WireCat</title>
    <script>
      try {
        const choice = JSON.parse(localStorage.getItem("wirecat.theme") || "{}").state?.choice ?? "system"
        const dark = choice === "dark" || (choice === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.dataset.theme = dark ? "dark" : "light"
      } catch {}
      try {
        const percent = Number(JSON.parse(localStorage.getItem("wirecat.scale") || "{}").state?.percent)
        if (percent >= 80 && percent <= 150) document.documentElement.style.setProperty("--ui-scale", String(percent / 100))
      } catch {}
    </script>
    <!-- The app's stylesheet arrives with its scripts, so the boot screen carries its own few colours (index.css). -->
    <style>
      html { background: #f1efed; }
      html[data-theme="dark"] { background: #171614; }
      #boot {
        --boot-ink: #182822;
        --boot-soft: #4c5e55;
        --boot-brand: #4b53f0;
        --boot-track: #e9e8e1;
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #f1efed;
        font-family: "Onest Variable", system-ui, sans-serif;
        transition: opacity 260ms cubic-bezier(0.25, 1, 0.5, 1);
      }
      html[data-theme="dark"] #boot {
        --boot-ink: #e9eeec;
        --boot-soft: #a7b1ae;
        --boot-brand: #6b72ff;
        --boot-track: #282723;
        background: #171614;
      }
      #boot[data-done] { opacity: 0; pointer-events: none; }
      #boot .boot-box { display: flex; flex-direction: column; align-items: center; gap: 1.4rem; }
      #boot .boot-logo { display: flex; align-items: center; gap: 0.9rem; height: 3.2rem; color: var(--boot-ink); }
      #boot .boot-logo svg { height: 100%; width: auto; }
      #boot .boot-logo svg + svg { height: 58%; }
      #boot .boot-slogan { margin: 0; font-size: 1.05rem; color: var(--boot-soft); text-align: center; }
      #boot .boot-tagline { margin: -0.9rem 0 0; font-size: 0.85rem; letter-spacing: 0.02em; color: var(--boot-soft); opacity: 0.8; text-align: center; }
      #boot .boot-bar { width: 9rem; height: 3px; border-radius: 3px; overflow: hidden; background: var(--boot-track); }
      #boot .boot-bar::after {
        content: "";
        display: block;
        width: 33%;
        height: 100%;
        border-radius: 3px;
        background: var(--boot-brand);
        animation: boot-slide 1.4s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
      @media (prefers-reduced-motion: reduce) {
        #boot { transition-duration: 0.01ms; }
        #boot .boot-bar::after { width: 100%; animation: none; opacity: 0.55; }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="WireCat">
      <div class="boot-box">
        <div class="boot-logo" aria-hidden="true">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="16" cy="16" r="16" fill="var(--boot-brand)" />
            <path d="M9 21V11l4 4 3-4 3 4 4-4v10" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" />
          </svg>

        </div>
        <p class="boot-slogan" id="boot-slogan">Your AI agent, wired to your own messages and files.</p>
        <!-- Only what holds: the Privacy dialog's "your data stays here", and the Apache-2.0 public source. -->
        <p class="boot-tagline" id="boot-tagline">Private · Open source · Local-first</p>
        <div class="boot-bar" aria-hidden="true"></div>
      </div>
    </div>
    <script>
      // The i18n catalog is not loaded yet; the language choice is read the way src/i18n does it.
      try {
        const slogans = {
          ru: "Ваш ИИ-агент, подключённый к вашим сообщениям и файлам.",
          es: "Tu agente de IA, conectado a tus mensajes y archivos.",
        }
        const taglines = {
          ru: "Приватно · Открытый код · Всё на вашем компьютере",
          es: "Privado · Código abierto · Todo en tu equipo",
        }
        const saved = JSON.parse(localStorage.getItem("wirecat.language") || "{}").state?.choice
        const tags = saved && saved !== "system" ? [saved] : navigator.languages || []
        const lang = tags.map((t) => t.toLowerCase().split("-")[0]).find((t) => ["en", "ru", "es"].includes(t))
        if (slogans[lang]) document.getElementById("boot-slogan").textContent = slogans[lang]
        if (taglines[lang]) document.getElementById("boot-tagline").textContent = taglines[lang]
        if (lang) document.documentElement.lang = lang
      } catch {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
