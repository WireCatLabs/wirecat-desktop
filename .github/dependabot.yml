version: 2
updates:
  # Actions are pinned by commit; this is what moves the pins forward.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release must be two weeks old, as for the audit tools; security updates are not delayed.
    cooldown:
      default-days: 14
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A release must be two weeks old, as for the audit tools; security updates are not delayed.
    cooldown:
      default-days: 14
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    # A release must be two weeks old, as for the audit tools; security updates are not delayed.
    cooldown:
      default-days: 14
    commit-message:
      prefix: "chore(deps)"
