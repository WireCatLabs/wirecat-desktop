name: Install check

# Installs a published release the way a user would, on a clean runner of each OS, and checks that the app starts.
# It is the only check of the macOS and Windows installers: nobody here has those machines. Then the installed app
# installs the WhatsApp tool through its own install code (`--self-test`, src-tauri/src/self_test.rs), once with
# no Node.js, so it sets up its own, and once with the runner's (bin/install-check-self-test). A release from
# before the self-test only gets a notice for that part. On Windows the installer and the installed app must carry
# a valid signature by WINDOWS_SIGNER (docs/dev/signing.md).
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release to install (empty = latest)
        required: false

permissions:
  contents: read

jobs:
  tag:
    # A dispatched Release run is a dry run on a branch and publishes nothing.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      self_test: ${{ steps.tag.outputs.self_test }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Whether the release's own source has the self-test; only a 404 means it does not.
          if found="$(gh api "repos/$GITHUB_REPOSITORY/contents/src-tauri/src/self_test.rs?ref=$tag" --jq .path 2>&1)"; then
            echo "self_test=true" >> "$GITHUB_OUTPUT"
          elif grep -q "HTTP 404" <<<"$found"; then
            echo "::notice::$tag has no --self-test (it came later), so no tool is installed by this check."
            echo "self_test=false" >> "$GITHUB_OUTPUT"
          else
            echo "$found"
            exit 1
          fi

  windows:
    needs: tag
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # The subject of the Certum certificate releases are signed with; release.yml checks its thumbprint.
      WINDOWS_SIGNER: CN=Open Source Developer Viacheslav Ptsarev, O=Open Source Developer, S=Valencia, C=ES
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          function Assert-Signed($file) {
            $sig = Get-AuthenticodeSignature $file
            $signer = "$($sig.SignerCertificate.Subject)"
            Write-Output "Signature: $($sig.Status), signer $signer ($(Split-Path $file -Leaf))"
            if ($sig.Status -ne "Valid") { throw "$file is not validly signed: $($sig.Status) $($sig.StatusMessage)" }
            if ($signer -ne $env:WINDOWS_SIGNER) { throw "$file is signed by $signer, not $env:WINDOWS_SIGNER." }
          }
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern "*_x64-setup.exe" --dir dl
          $setup = (Get-ChildItem dl -Filter *-setup.exe)[0].FullName
          Assert-Signed $setup
          Start-Process $setup -ArgumentList "/S" -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\WireCat", "$env:ProgramFiles\WireCat" -Filter *.exe -ErrorAction SilentlyContinue |
            Where-Object Name -NotLike "uninstall*" | Select-Object -First 1
          if (-not $exe) { throw "The installer put no app in LOCALAPPDATA\WireCat or Program Files\WireCat." }
          Write-Output "Installed: $($exe.FullName)"
          Assert-Signed $exe.FullName
          "APP=$($exe.FullName)" >> $env:GITHUB_ENV
          $app = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 20
          if ($app.HasExited) { throw "The app quit within 20 s, exit code $($app.ExitCode)." }
          Stop-Process -Id $app.Id
      - if: needs.tag.outputs.self_test == 'true'
        run: pwsh bin/install-check-self-test.ps1 $env:APP self-test
      - if: always() && needs.tag.outputs.self_test == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: self-test-windows
          path: self-test
          if-no-files-found: ignore
      - run: |
          $exe = Get-Item $env:APP
          $uninstall = Join-Path $exe.DirectoryName "uninstall.exe"
          Start-Process $uninstall -ArgumentList "/S" -Wait
          # The uninstaller relaunches itself from a temp copy, so -Wait returns before it is done.
          for ($i = 0; $i -lt 30 -and (Test-Path $exe.FullName); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe.FullName) { throw "The uninstaller left $($exe.FullName)." }

  macos:
    needs: tag
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.dmg" --dir dl
          mount="$(hdiutil attach -nobrowse dl/*.dmg | awk -F'\t' '/\/Volumes\// {print $NF}')"
          mkdir -p ~/Applications
          cp -R "$mount"/*.app ~/Applications/
          hdiutil detach "$mount"
          app="$(ls -d ~/Applications/*.app | head -1)"
          lipo -archs "$app"/Contents/MacOS/*
          codesign --display --verbose=2 "$app" 2>&1 | grep -E "^(Signature|Authority|TeamIdentifier)=" || true
          codesign --verify --deep --strict "$app"
          # What Gatekeeper tells a user who opens the downloaded .dmg, then the app in it.
          spctl --assess --type open --context context:primary-signature -vv dl/*.dmg
          spctl --assess --type execute -vv "$app"
          "$app"/Contents/MacOS/* &
          pid=$!
          sleep 20
          kill -0 "$pid" || { echo "::error::The app quit within 20 s."; exit 1; }
          kill "$pid"
          echo "APP=$(ls -d "$app"/Contents/MacOS/* | head -1)" >> "$GITHUB_ENV"
      - if: needs.tag.outputs.self_test == 'true'
        run: bash bin/install-check-self-test "$APP" self-test
      - if: always() && needs.tag.outputs.self_test == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: self-test-macos
          path: self-test
          if-no-files-found: ignore

  linux:
    needs: tag
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.deb" --pattern "*.AppImage" --dir dl
          gh release download v0.1.0 --repo "$GITHUB_REPOSITORY" --pattern "*.deb" --dir old
          bash .github/scripts/ubuntu-dns.sh
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -q
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y -q xvfb
          # A copy of the first release, whose package was still called wire-cat, must give way to the new one.
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y -q ./old/*.deb
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y -q ./dl/*.deb
          dpkg-query -W -f '${Package} ${Version} ${Status}\n' wirecat wire-cat || true
          bin="$(dpkg -L "$(dpkg-deb -f dl/*.deb Package)" | grep '^/usr/bin/' | head -1)"
          grep -H '^Name=' /usr/share/applications/*.desktop | grep -i wirecat
          check() {
            xvfb-run -a "$@" &
            pid=$!
            sleep 20
            kill -0 "$pid" || { echo "::error::$1 quit within 20 s."; exit 1; }
            kill "$pid"
          }
          check "$bin"
          echo "APP=$bin" >> "$GITHUB_ENV"
          chmod +x dl/*.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          check "$(ls dl/*.AppImage)"
      # The self-test opens no window, so it needs no display.
      - if: needs.tag.outputs.self_test == 'true'
        run: bash bin/install-check-self-test "$APP" self-test
      - if: always() && needs.tag.outputs.self_test == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: self-test-linux
          path: self-test
          if-no-files-found: ignore

  fedora:
    needs: tag
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container: fedora:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          dnf install -y -q gh jq
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.rpm" --dir dl
          gh release download v0.1.0 --repo "$GITHUB_REPOSITORY" --pattern "*.rpm" --dir old
          dnf install -y -q ./old/*.rpm
          dnf install -y -q ./dl/*.rpm
          rpm -qi "$(rpm -qp --qf '%{NAME}' dl/*.rpm)"
          rpm -ql "$(rpm -qp --qf '%{NAME}' dl/*.rpm)" | grep -E '^/usr/bin/|\.desktop$'
          echo "APP=$(rpm -ql "$(rpm -qp --qf '%{NAME}' dl/*.rpm)" | grep '^/usr/bin/' | head -1)" >> "$GITHUB_ENV"
      # The container has no Node.js, as a fresh Fedora: only the run with WireCat's own.
      - if: needs.tag.outputs.self_test == 'true'
        run: bash bin/install-check-self-test "$APP" self-test
      - if: always() && needs.tag.outputs.self_test == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: self-test-fedora
          path: self-test
          if-no-files-found: ignore
