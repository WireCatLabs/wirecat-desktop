name: macOS signing check

# Proves the five APPLE_* secrets sign and notarize a build before a release depends on them: one job signs, a fresh
# runner that never saw the secrets opens the result the way a downloaded copy is opened.
on:
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/mac-sign-check.yml]

permissions:
  contents: read

jobs:
  sign:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || { echo "::error::$name is not set."; exit 1; }
          done
          pnpm tauri build --bundles dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 3

  open:
    needs: sign
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dmg
          path: dl
      - run: |
          dmg="$(ls dl/*.dmg)"
          # The mark a browser puts on a download: Gatekeeper checks only files that carry it.
          xattr -w com.apple.quarantine "0081;$(printf %x "$(date +%s)");Safari;" "$dmg"
          mount="$(hdiutil attach -nobrowse "$dmg" | awk -F'\t' '/\/Volumes\// {print $NF}')"
          mkdir -p ~/Applications
          cp -R "$mount"/*.app ~/Applications/
          hdiutil detach "$mount"
          app="$(ls -d ~/Applications/*.app | head -1)"
          codesign --display --verbose=2 "$app" 2>&1 | grep -E '^(Authority|TeamIdentifier)='
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"
          "$app"/Contents/MacOS/* &
          pid=$!
          sleep 20
          kill -0 "$pid" || { echo "::error::The app quit within 20 s."; exit 1; }
          kill "$pid"
