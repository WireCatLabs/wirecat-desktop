name: Apt repository

# Builds https://apt.wirecat.dev from the last three published releases and deploys it to GitHub Pages
# (bin/apt-repo-build). Release calls it after `publish`. To rebuild without a release, run it on a tag:
# `gh workflow run apt-repo.yml --ref v<version>`, because the release environment admits only v* tags.
on:
  workflow_call:
    # A called workflow sees an environment secret only when the caller passes it; otherwise it is silently empty.
    secrets:
      APT_SIGNING_KEY:
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apt-repo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - timeout-minutes: 5
        run: |
          bash .github/scripts/ubuntu-dns.sh
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y appstream
      - env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: bin/apt-repo-build --site "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
