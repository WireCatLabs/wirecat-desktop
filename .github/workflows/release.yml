name: Release

# A tag v<package.json version> builds every installer into a draft GitHub Release, published once latest.json has
# every platform (the owner wants releases fully automated, NEED-134).
# Plan: docs/dev/plans/2026-10-29-first-release.md
# Signing is split from the build (D3 in docs/dev/plans/2026-11-06-windows-signing-flow.md): `build` compiles with no
# secret, and `sign` bundles that build with the keys and never installs or runs our dependencies.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run on a branch: build and bundle with no signing secret and a throwaway updater key, publish nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/security.yml

  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.draft.outputs.id }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every copy trusts only the updater key it was built with: a release without one can never update itself.
      # The private key is checked in `sign`, the only job that can read it.
      - id: version
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          tag="v$(jq -r .version package.json)"
          if [ -z "$(jq -r '.plugins.updater.pubkey' src-tauri/tauri.conf.json)" ]; then
            echo "::error::No updater key. Run bin/setup-updater-key and commit src-tauri/tauri.conf.json first."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = true ]; then
            echo "::notice::Dry run: no draft release, no signing secret, nothing is uploaded."
            exit 0
          fi
          # The release environment, which holds the signing secrets, admits only v* tags.
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::Run this workflow on the tag $tag, not on a branch."
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($tag)."
            exit 1
          fi
      # One job makes the draft, so the three builds cannot each make their own.
      - id: draft
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          find_draft() {
            gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\""
          }
          read -r id draft <<<"$(find_draft)" || true
          if [ -n "${id:-}" ] && [ "$draft" != true ]; then
            echo "::error::$TAG is already published. Bump the version in package.json."
            exit 1
          fi
          # The id comes from the create call itself: the release list lags behind a new draft.
          # The notes are written before tagging (.claude/skills/release-notes), not generated from the PR list.
          if [ -z "${id:-}" ]; then
            [ -s "docs/releases/${TAG#v}.md" ] || { echo "::error::docs/releases/${TAG#v}.md is missing."; exit 1; }
            id="$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
              -f name="WireCat ${TAG#v}" -F draft=true -F "body=@docs/releases/${TAG#v}.md" --jq .id)"
          fi
          if [ -z "${id:-}" ]; then
            echo "::error::Could not create or find the draft release for $TAG."
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  # Every npm install script and Rust build script runs here, so this job reads no secret and writes nothing but the
  # compiled app.
  build:
    needs: [security, draft]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04, not latest: an AppImage runs only on systems with this glibc or newer.
          - os: ubuntu-22.04
            target: ""
            out: target/release
            exe: wirecat-desktop
          # One universal app: both darwin entries of latest.json, one download for every Mac.
          - os: macos-latest
            target: --target universal-apple-darwin
            out: target/universal-apple-darwin/release
            exe: wirecat-desktop
          - os: windows-latest
            target: ""
            out: target/release
            exe: wirecat-desktop.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No cache: what this job builds gets signed, and a dependency cache can be written by any run on main.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --no-bundle ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ matrix.os }}
          path: src-tauri/${{ matrix.out }}/${{ matrix.exe }}
          if-no-files-found: error
          retention-days: 3

  # Bundles, signs and uploads the compiled app. No pnpm install and no app build script runs here: the code that sees
  # the keys is the Tauri CLI, the NSIS tools it downloads, ssign, and Apple's tools.
  sign:
    needs: [draft, build]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: ""
            bundles: ""
            out: target/release
          - os: macos-latest
            target: --target universal-apple-darwin
            bundles: ""
            out: target/universal-apple-darwin/release
          # NSIS only: it installs per user, so neither the install nor an update asks for administrator rights.
          - os: windows-latest
            target: ""
            bundles: --bundles nsis
            out: target/release
    runs-on: ${{ matrix.os }}
    # The release environment admits only v* tags; a dry run on a branch runs with no environment and no secret.
    environment: ${{ !inputs.dry_run && 'release' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The AppImage carries these libraries, so the bundler needs them on the system.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-${{ matrix.os }}
          path: src-tauri/${{ matrix.out }}
      # The same CLI version the build used, without its dependencies' install scripts.
      - run: |
          chmod +x src-tauri/${{ matrix.out }}/wirecat-desktop* || true
          version="$(sed -n "s|^  '@tauri-apps/cli@\([0-9.]*\)':$|\1|p" pnpm-lock.yaml | head -n 1)"
          [ -n "$version" ] || { echo "::error::No @tauri-apps/cli version in pnpm-lock.yaml."; exit 1; }
          npm install --global --ignore-scripts "@tauri-apps/cli@$version"
      # Tauri treats a variable that is set but empty as a certificate to import, so each value is exported only when
      # it is needed, and only the steps after this one see it.
      - id: secrets
        if: ${{ !inputs.dry_run }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          CERTUM_EMAIL: ${{ runner.os == 'Windows' && secrets.CERTUM_EMAIL || '' }}
          CERTUM_OTP: ${{ runner.os == 'Windows' && secrets.CERTUM_OTP || '' }}
          WINDOWS_SIGNER_SHA1: ${{ vars.WINDOWS_SIGNER_SHA1 }}
        run: |
          guide="docs/dev/plans/2026-11-05-windows-signing-setup.md"
          export_env() {
            local end="END_${RANDOM}${RANDOM}${RANDOM}${RANDOM}"
            { echo "$1<<$end"; echo "${!1}"; echo "$end"; } >> "$GITHUB_ENV"
          }
          require() {
            local missing=""
            for name in "$@"; do [ -n "${!name}" ] || missing="$missing $name"; done
            [ -z "$missing" ] || { echo "::error::Not set in the release environment:$missing. See $guide."; exit 1; }
          }
          require TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          export_env TAURI_SIGNING_PRIVATE_KEY
          export_env TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          case "$RUNNER_OS" in
            macOS)
              require APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
              for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
                export_env "$name"
              done
              ;;
            Windows)
              # Fail closed (D4): once any part of the Certum setup exists, an unsigned installer stops the release.
              # Before the setup script has run, none exists and Windows ships unsigned.
              if [ -z "$CERTUM_EMAIL$CERTUM_OTP$WINDOWS_SIGNER_SHA1" ]; then
                echo "::notice::Windows signing is not set up yet ($guide): the installer is not signed."
                exit 0
              fi
              require CERTUM_EMAIL CERTUM_OTP WINDOWS_SIGNER_SHA1
              export_env CERTUM_EMAIL
              export_env CERTUM_OTP
              echo "config=--config src-tauri/tauri.windows-sign.conf.json" >> "$GITHUB_OUTPUT"
              ;;
          esac
      # A dry run still makes and checks real updater signatures, with a key that exists only on this runner.
      - if: ${{ inputs.dry_run }}
        run: |
          tauri signer generate --ci -w "$RUNNER_TEMP/dry-run.key" -p dry-run >/dev/null
          { echo "TAURI_SIGNING_PRIVATE_KEY<<END_KEY"; cat "$RUNNER_TEMP/dry-run.key"; echo; echo "END_KEY"; } >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=dry-run" >> "$GITHUB_ENV"
          # Apple Silicon runs only signed apps, so the dry run signs ad hoc.
          [ "$RUNNER_OS" != macOS ] || echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
      # ssign signs over Certum's cloud API with the SimplySign TOTP seed: docs/dev/plans/2026-10-29-first-release.md.
      # Our fork of ssign: v0.1.9, reviewed in docs/dev/research/2026-11-05-ssign-review.md, plus patches P1-P6.
      # A dry run builds it too, so a pin that no longer builds on Windows shows up before a tag.
      - if: steps.secrets.outputs.config || (inputs.dry_run && runner.os == 'Windows')
        run: cargo install --locked --git https://github.com/WireCatLabs/ssign --rev c7a3b2afe272636628535912b48312d9b4606094 ssign
      # The app exe is signed before NSIS packs it, and the installer before its updater .sig is made.
      - env:
          WINDOWS_SIGN_CONFIG: ${{ steps.secrets.outputs.config }}
        run: |
          # shellcheck disable=SC2086
          tauri bundle ${{ matrix.target }} ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json \
            $WINDOWS_SIGN_CONFIG
      # Tauri restores the unsigned app exe in target/release after bundling, so the signed copy is checked inside the
      # installer. Every exe there must carry our certificate: no Microsoft-signed exe is embedded today
      # (webviewInstallMode is the default download bootstrapper).
      - if: steps.secrets.outputs.config
        shell: pwsh
        env:
          WINDOWS_SIGNER_SHA1: ${{ vars.WINDOWS_SIGNER_SHA1 }}
        run: |
          $expected = ($env:WINDOWS_SIGNER_SHA1 -replace '[^0-9A-Fa-f]', '').ToUpper()
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if (-not $installers) { throw "No NSIS installer found." }
          $failed = $false
          foreach ($installer in $installers) {
            $dir = Join-Path $env:RUNNER_TEMP "signed-$($installer.BaseName)"
            7z x $installer.FullName "-o$dir" -y | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "7z could not unpack $($installer.Name)." }
            $inner = @(Get-ChildItem $dir -Recurse -File -Filter *.exe)
            if (-not ($inner | Where-Object { $_.Name -notlike 'uninstall*' })) {
              throw "$($installer.Name) holds no app exe."
            }
            foreach ($file in @($installer) + $inner) {
              $sig = Get-AuthenticodeSignature $file.FullName
              $thumb = "$($sig.SignerCertificate.Thumbprint)"
              $problems = @()
              if ($sig.Status -ne 'Valid') { $problems += "signature $($sig.Status): $($sig.StatusMessage)" }
              if ($thumb -ne $expected) { $problems += "signer thumbprint $thumb, expected $expected" }
              if (-not $sig.TimeStamperCertificate) { $problems += "no timestamp" }
              Write-Output "$($file.Name): $($sig.Status), signer $($sig.SignerCertificate.Subject), thumbprint $thumb"
              Write-Output "  timestamp by $($sig.TimeStamperCertificate.Subject)"
              foreach ($problem in $problems) { Write-Output "::error::$($file.Name): $problem"; $failed = $true }
            }
          }
          if ($failed) { exit 1 }
      - env:
          BUNDLE: src-tauri/${{ matrix.out }}/bundle
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          mkdir release-files
          case "$RUNNER_OS" in
            Linux)
              cp "$BUNDLE"/appimage/*.AppImage{,.sig} "$BUNDLE"/deb/*.deb{,.sig} "$BUNDLE"/rpm/*.rpm{,.sig} release-files/
              ;;
            macOS)
              # The name tauri-action gave it in earlier releases.
              name="WireCat_$(jq -r .version package.json)_universal.app.tar.gz"
              cp "$BUNDLE"/dmg/*.dmg release-files/
              cp "$BUNDLE/macos/WireCat.app.tar.gz" "release-files/$name"
              cp "$BUNDLE/macos/WireCat.app.tar.gz.sig" "release-files/$name.sig"
              ;;
            Windows)
              cp "$BUNDLE"/nsis/*-setup.exe{,.sig} release-files/
              ;;
          esac
          [ "$DRY_RUN" != true ] || cp "$RUNNER_TEMP/dry-run.key.pub" release-files/dry-run.pub
          ls -l release-files
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.os }}
          path: release-files/
          if-no-files-found: error
          retention-days: 3
      - if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: gh release upload "$TAG" release-files/* --repo "$GITHUB_REPOSITORY" --clobber

  # One job writes latest.json after every upload, so no two builds race on it, and it goes up only when each updater
  # signature matches the public key installed copies trust.
  updater:
    needs: [draft, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-files
      - run: |
          sudo apt-get update
          sudo apt-get install -y minisign
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
          RELEASE_ID: ${{ needs.draft.outputs.id }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          scripts/latest-json.sh release-files src-tauri/tauri.conf.json "${TAG#v}" latest.json
          jq . latest.json
          [ "$DRY_RUN" = true ] || gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber

  notarize-dmg:
    needs: [draft, sign]
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: write
    uses: ./.github/workflows/notarize-dmg.yml
    with:
      tag: ${{ needs.draft.outputs.tag }}
    # Until the Apple secrets move into the release environment, the repository copies reach it only this way.
    secrets: inherit

  publish:
    needs: [draft, updater, notarize-dmg]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    # Only push access lists draft releases.
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir .
          missing=""
          for key in darwin-aarch64 darwin-x86_64 linux-x86_64 windows-x86_64; do
            jq -e --arg k "$key" '.platforms[$k].url and .platforms[$k].signature' latest.json >/dev/null || missing="$missing $key"
          done
          if [ -n "$missing" ]; then
            echo "::error::latest.json lacks:$missing. Re-run the failed sign job of that system."
            exit 1
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
